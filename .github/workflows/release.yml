name: Publish reviewed research release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag pointing to the reviewed main commit
        required: true
        type: string
      reviewed_commit:
        description: Exact reviewed 40-character main commit SHA
        required: true
        type: string
permissions: {}
concurrency:
  group: reviewed-research-release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
  REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: .:bank_monitoring
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check dispatch and existing refs before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py --check
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Replay pinned source objects, frozen fits and independent validation
        run: |
          python scripts/reproduce.py
          python scripts/build_presentation.py --check
          node tests/check_explorer.cjs
      - name: Check refs again after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py --check
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck existing tag and main, then publish without retagging
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_guard.py --publish
